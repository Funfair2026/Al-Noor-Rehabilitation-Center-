<!DOCTYPE html>
<html>
<head>
    <title>Funfair QR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 30px;
            text-align: center;
        }
        .card {
            background: white;
            border: 2px solid #4b4b9f;
            border-radius: 12px;
            padding: 20px;
            max-width: 400px;
            margin: auto;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>🎫 Funfair Entry</h2>
        <p><strong>Name:</strong> {{ full_name }}</p>
        <p><strong>Ticket ID:</strong> {{ ticket_id }}</p>
        <p><strong>Balance:</strong> AED {{ balance }}</p>
    </div>
</body>
</html>
