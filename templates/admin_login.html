<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Funfair 2025</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'glow': 'glow 2s ease-in-out infinite alternate',
                        'slide-up': 'slideUp 0.6s ease-out',
                        'fade-in': 'fadeIn 0.8s ease-out',
                        'pulse-slow': 'pulse 3s infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-20px)' },
                        },
                        glow: {
                            '0%': { boxShadow: '0 0 20px rgba(59, 130, 246, 0.5)' },
                            '100%': { boxShadow: '0 0 40px rgba(59, 130, 246, 0.8)' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(30px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-900 flex items-center justify-center p-4">
    <!-- Animated Background -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -right-40 w-80 h-80 bg-blue-400 opacity-10 rounded-full animate-float"></div>
        <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-purple-400 opacity-10 rounded-full animate-float" style="animation-delay: 2s;"></div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-pink-400 opacity-10 rounded-full animate-pulse-slow"></div>
    </div>

    <div class="relative z-10 w-full max-w-md">
        <!-- Login Card -->
        <div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl p-8 shadow-2xl animate-slide-up">
            <!-- Header -->
            <div class="text-center mb-8 animate-fade-in">
                <div class="inline-block p-4 bg-gradient-to-r from-blue-500 to-purple-500 rounded-2xl mb-4 animate-glow">
                    <span class="text-4xl"></span>
                </div>
                <h1 class="text-3xl font-bold text-white mb-2">Admin Portal</h1>
                <p class="text-white/70">Funfair QR Code Payment System</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="space-y-6 animate-slide-up" style="animation-delay: 0.2s;">
                <div class="space-y-4">
                    <div>
                        <label for="username" class="block text-sm font-semibold text-white/90 mb-2">
                            Username
                        </label>
                        <div class="relative">
                            <input 
                                type="text" 
                                id="username" 
                                name="username" 
                                required 
                                placeholder=""
                                class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300"
                            >
                            <div class="absolute inset-y-0 right-0 flex items-center pr-3">
                                <span class="text-white/50"></span>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-semibold text-white/90 mb-2">
                            Password
                        </label>
                        <div class="relative">
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                required 
                                placeholder=""
                                class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300"
                            >
                            <div class="absolute inset-y-0 right-0 flex items-center pr-3">
                                <span class="text-white/50"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Login Button -->
                <button 
                    type="submit" 
                    id="loginBtn"
                    class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-bold py-4 px-6 rounded-xl transition-all duration-300 transform hover:scale-105 hover:shadow-lg focus:outline-none focus:ring-4 focus:ring-blue-500/50"
                >
                    <span id="loginBtnText">Login to Admin Portal</span>
                </button>
            </form>

            <!-- Back Button -->
            <div class="mt-6 text-center animate-slide-up" style="animation-delay: 0.4s;">
                <a 
                    href="/" 
                    class="inline-flex items-center text-white/70 hover:text-white transition-colors duration-300"
                >
                    <span class="mr-2">←</span>
                    Back to Home
                </a>
            </div>

            <!-- Security Notice -->
            <div class="mt-6 p-4 bg-yellow-500/20 border border-yellow-500/30 rounded-xl animate-fade-in" style="animation-delay: 0.6s;">
                <div class="flex items-center text-yellow-200">
                    <span class="text-lg mr-2"></span>
                    <span class="text-sm">
                        <strong>Secure Access:</strong> Authorized administrators only
                    </span>
                </div>
            </div>
        </div>

        <!-- Floating Elements -->
        <div class="absolute -top-10 -left-10 w-20 h-20 bg-blue-400/20 rounded-full animate-pulse"></div>
        <div class="absolute -bottom-10 -right-10 w-16 h-16 bg-purple-400/20 rounded-full animate-pulse" style="animation-delay: 1s;"></div>
    </div>

    <!-- Message Display -->
    <div id="message" class="fixed top-4 right-4 z-50 max-w-sm"></div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const loginBtn = document.getElementById('loginBtn');
            const loginBtnText = document.getElementById('loginBtnText');
            const messageDiv = document.getElementById('message');
            
            // Disable button and show loading
            loginBtn.disabled = true;
            loginBtnText.innerHTML = 'Logging in...';
            loginBtn.classList.add('opacity-75', 'cursor-not-allowed');
            
            const formData = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };
            
            try {
                // Create AbortController for timeout
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000); // 10 second timeout
                
                const response = await fetch('/admin_login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                
                let result;
                try {
                    result = await response.json();
                } catch (jsonError) {
                    // If response is not JSON, it might be a rate limit error
                    if (response.status === 429) {
                        messageDiv.innerHTML = `
                            <div class="bg-orange-500 text-white px-6 py-4 rounded-xl shadow-lg animate-slide-up">
                                <div class="flex items-center">
                                    <span class="text-xl mr-2">⏱</span>
                                    <span>Too many login attempts. Please wait a few minutes and try again.</span>
                                </div>
                            </div>
                        `;
                        setTimeout(() => {
                            messageDiv.innerHTML = '';
                        }, 8000);
                        return;
                    }
                    throw jsonError;
                }
                
                if (response.ok) {
                    // Store token
                    localStorage.setItem('admin_token', result.token);
                    
                    // Show success message
                    messageDiv.innerHTML = `
                        <div class="bg-green-500 text-white px-6 py-4 rounded-xl shadow-lg animate-slide-up">
                            <div class="flex items-center">
                                <span class="text-xl mr-2">✓</span>
                                <span>Login successful! Redirecting...</span>
                            </div>
                        </div>
                    `;
                    
                    // Redirect to admin dashboard
                    setTimeout(() => {
                        window.location.href = '/admin';
                    }, 1500);
                } else {
                    // Handle specific error codes
                    let errorMessage = result.error || 'Login failed';
                    let errorColor = 'bg-red-500';
                    
                    if (response.status === 429) {
                        errorMessage = 'Too many login attempts. Please wait a few minutes and try again.';
                        errorColor = 'bg-orange-500';
                    } else if (response.status === 403) {
                        errorColor = 'bg-yellow-500';
                    }
                    
                    // Show error message
                    messageDiv.innerHTML = `
                        <div class="${errorColor} text-white px-6 py-4 rounded-xl shadow-lg animate-slide-up">
                            <div class="flex items-center">
                                <span class="text-xl mr-2">${response.status === 429 ? '⏱' : '✗'}</span>
                                <span>${errorMessage}</span>
                            </div>
                        </div>
                    `;
                    
                    // Auto-hide error message (longer for rate limit errors)
                    setTimeout(() => {
                        messageDiv.innerHTML = '';
                    }, response.status === 429 ? 8000 : 5000);
                }
            } catch (error) {
                // Handle network errors, timeouts, etc.
                let errorMessage = 'Network error. Please check your connection and try again.';
                
                if (error.name === 'TimeoutError' || error.name === 'AbortError') {
                    errorMessage = 'Request timed out. Please try again.';
                } else if (error.message && error.message.includes('fetch')) {
                    errorMessage = 'Unable to connect to server. Please check your connection.';
                }
                
                messageDiv.innerHTML = `
                    <div class="bg-red-500 text-white px-6 py-4 rounded-xl shadow-lg animate-slide-up">
                        <div class="flex items-center">
                            <span class="text-xl mr-2">❌</span>
                            <span>${errorMessage}</span>
                        </div>
                    </div>
                `;
                
                setTimeout(() => {
                    messageDiv.innerHTML = '';
                }, 6000);
            }
            
            // Re-enable button
            loginBtn.disabled = false;
            loginBtnText.innerHTML = 'Login to Admin Portal';
            loginBtn.classList.remove('opacity-75', 'cursor-not-allowed');
        });
    </script>
</body>
</html>
