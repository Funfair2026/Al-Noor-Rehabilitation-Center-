<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Complete - Funfair</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 10px; text-align: center; }
        .success { color: #28a745; font-weight: bold; }
        .btn { display: inline-block; margin-top: 16px; padding: 10px 16px; background: #6c757d; color: #fff; border: 0; border-radius: 6px; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="success">Payment Successful</h2>
        <p>Amount: AED {{ amount }}</p>
        <p>Counter: {{ counter }}</p>
        <a href="/corporate_scanner" class="btn">Process Another</a>
    </div>
</body>
</html>
