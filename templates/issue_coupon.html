<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue New QR Code - Funfair 2025</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'glow': 'glow 2s ease-in-out infinite alternate',
                        'slide-up': 'slideUp 0.6s ease-out',
                        'fade-in': 'fadeIn 0.8s ease-out',
                        'pulse-slow': 'pulse 3s infinite',
                        'bounce-slow': 'bounce 3s infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-20px)' },
                        },
                        glow: {
                            '0%': { boxShadow: '0 0 20px rgba(34, 197, 94, 0.5)' },
                            '100%': { boxShadow: '0 0 40px rgba(34, 197, 94, 0.8)' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(30px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-gradient-to-br from-green-600 via-teal-600 to-blue-600">
    <!-- Animated Background -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -right-40 w-80 h-80 bg-green-400 opacity-10 rounded-full animate-float"></div>
        <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-teal-400 opacity-10 rounded-full animate-float" style="animation-delay: 2s;"></div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-blue-400 opacity-10 rounded-full animate-pulse-slow"></div>
    </div>

    <div class="relative z-10 min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-2xl">
            <!-- Header -->
            <div class="text-center mb-8 animate-fade-in">
                <div class="inline-block p-4 bg-gradient-to-r from-green-500 to-teal-500 rounded-2xl mb-6 animate-glow">
                    <span class="text-5xl"></span>
                </div>
                <h1 class="text-4xl md:text-5xl font-bold text-white mb-4 drop-shadow-2xl">
                    Issue New QR Code
                </h1>
                <p class="text-lg text-white/80">
                    Create a QR code for visitors with initial balance
                </p>
            </div>

            <!-- Form Card -->
            <div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl p-8 shadow-2xl animate-slide-up">
                <form id="issueForm" class="space-y-6">
                    <!-- Visitor Name -->
                    <div>
                        <label for="full_name" class="block text-sm font-semibold text-white/90 mb-3">
                            Visitor's Full Name
                        </label>
                        <div class="relative">
                            <input 
                                type="text" 
                                id="full_name" 
                                name="full_name" 
                                required 
                                placeholder=""
                                class="w-full px-4 py-4 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all duration-300 text-lg"
                            >
                            <div class="absolute inset-y-0 right-0 flex items-center pr-3">
                                <span class="text-white/50 text-xl"></span>
                            </div>
                        </div>
                    </div>

                    <!-- Amount -->
                    <div>
                        <label for="amount" class="block text-sm font-semibold text-white/90 mb-3">
                            Amount (AED)
                        </label>
                        <div class="relative">
                            <input 
                                type="number" 
                                id="amount" 
                                name="amount" 
                                min="10" 
                                step="0.01" 
                                required 
                                placeholder=""
                                class="w-full px-4 py-4 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all duration-300 text-lg"
                            >
                            <div class="absolute inset-y-0 right-0 flex items-center pr-3">
                                <span class="text-white/50 text-xl"></span>
                            </div>
                        </div>
                        <p class="text-white/60 text-sm mt-2">Minimum amount is AED 10.00</p>
                    </div>


                    <!-- Submit Button -->
                    <button 
                        type="submit" 
                        id="submitBtn"
                        class="w-full bg-gradient-to-r from-green-600 to-teal-600 hover:from-green-700 hover:to-teal-700 text-white font-bold py-4 px-6 rounded-xl transition-all duration-300 transform hover:scale-105 hover:shadow-lg focus:outline-none focus:ring-4 focus:ring-green-500/50 text-lg"
                    >
                        <span id="submitBtnText">Issue QR Code</span>
                    </button>
                </form>
            </div>

            <!-- Message Display -->
            <div id="message" class="mt-6"></div>

            <!-- QR Display -->
            <div id="qrDisplay" class="mt-6"></div>

            <!-- Back Button -->
            <div class="mt-8 text-center animate-slide-up" style="animation-delay: 0.4s;">
                <a 
                    href="/admin" 
                    class="inline-flex items-center bg-white/10 hover:bg-white/20 backdrop-blur-lg border border-white/20 text-white px-6 py-3 rounded-xl transition-all duration-300 transform hover:scale-105"
                >
                    <span class="mr-2">←</span>
                    Back to Admin Portal
                </a>
            </div>
        </div>
    </div>

    <!-- Floating particles -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden">
        <div class="absolute top-1/4 left-1/4 w-2 h-2 bg-green-400/30 rounded-full animate-ping" style="animation-delay: 0s;"></div>
        <div class="absolute top-3/4 left-3/4 w-3 h-3 bg-teal-400/40 rounded-full animate-ping" style="animation-delay: 2s;"></div>
        <div class="absolute top-1/2 left-1/3 w-1 h-1 bg-blue-400/50 rounded-full animate-ping" style="animation-delay: 4s;"></div>
        <div class="absolute top-1/3 right-1/4 w-2 h-2 bg-emerald-400/40 rounded-full animate-ping" style="animation-delay: 6s;"></div>
    </div>

    <script>
        // Check for admin token on page load
        const adminToken = localStorage.getItem('admin_token');
        if (!adminToken) {
            window.location.href = '/admin_login';
        }
        
        document.getElementById('issueForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Check for admin token
            const adminToken = localStorage.getItem('admin_token');
            if (!adminToken) {
                window.location.href = '/admin_login';
                return;
            }
            
            const submitBtn = document.getElementById('submitBtn');
            const submitBtnText = document.getElementById('submitBtnText');
            const messageDiv = document.getElementById('message');
            const qrDisplay = document.getElementById('qrDisplay');
            
            // Disable button and show loading
            submitBtn.disabled = true;
            submitBtnText.innerHTML = 'Processing...';
            submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
            
            const formData = {
                full_name: document.getElementById('full_name').value,
                amount: document.getElementById('amount').value
            };
            
            try {
                const response = await fetch('/issue_coupon', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${adminToken}`
                    },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    // Show success message
                    messageDiv.innerHTML = `
                        <div class="bg-green-500/20 backdrop-blur-lg border border-green-500/30 rounded-2xl p-6 animate-fade-in">
                            <div class="flex items-center justify-center text-green-200">
                                <span class="text-2xl mr-3">✓</span>
                                <div>
                                    <h3 class="text-lg font-bold">${result.message}</h3>
                                    <p class="text-sm opacity-90">QR code generated successfully!</p>
                                </div>
                            </div>
                        </div>
                    `;
                    
                    // Display QR code
                    qrDisplay.innerHTML = `
                        <div class="bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl p-8 text-center animate-slide-up">
                            <h3 class="text-xl font-bold text-white mb-6">Generated QR Code</h3>
                            <div class="bg-white p-4 rounded-2xl inline-block mb-6 shadow-2xl">
                                <img src="data:image/png;base64,${result.qr_code_img_str}" alt="QR Code" class="max-w-xs mx-auto">
                            </div>
                            <div class="space-y-3">
                                <a href="${result.print_url}" target="_blank" class="inline-block w-full bg-gradient-to-r from-blue-500 to-cyan-500 hover:from-blue-600 hover:to-cyan-600 text-white font-bold py-3 px-6 rounded-xl transition-all duration-300 transform hover:scale-105 hover:shadow-lg">
                                    Print QR Code
                                </a>
                                <button onclick="document.getElementById('issueForm').reset(); document.getElementById('message').innerHTML=''; document.getElementById('qrDisplay').innerHTML='';" class="w-full bg-gradient-to-r from-gray-500 to-gray-600 hover:from-gray-600 hover:to-gray-700 text-white font-bold py-3 px-6 rounded-xl transition-all duration-300 transform hover:scale-105">
                                    Create Another QR Code
                                </button>
                            </div>
                        </div>
                    `;
                    
                    // Reset form
                    document.getElementById('issueForm').reset();
                } else {
                    // Show error message
                    messageDiv.innerHTML = `
                        <div class="bg-red-500/20 backdrop-blur-lg border border-red-500/30 rounded-2xl p-6 animate-fade-in">
                            <div class="flex items-center justify-center text-red-200">
                                <span class="text-2xl mr-3">❌</span>
                                <div>
                                    <h3 class="text-lg font-bold">Error</h3>
                                    <p class="text-sm opacity-90">${result.error}</p>
                                </div>
                            </div>
                        </div>
                    `;
                    qrDisplay.innerHTML = '';
                    
                    // Auto-hide error message
                    setTimeout(() => {
                        messageDiv.innerHTML = '';
                    }, 5000);
                }
            } catch (error) {
                messageDiv.innerHTML = `
                    <div class="bg-red-500/20 backdrop-blur-lg border border-red-500/30 rounded-2xl p-6 animate-fade-in">
                        <div class="flex items-center justify-center text-red-200">
                            <span class="text-2xl mr-3">❌</span>
                            <div>
                                <h3 class="text-lg font-bold">Network Error</h3>
                                <p class="text-sm opacity-90">Please try again.</p>
                            </div>
                        </div>
                    </div>
                `;
                qrDisplay.innerHTML = '';
                
                setTimeout(() => {
                    messageDiv.innerHTML = '';
                }, 5000);
            }
            
            // Re-enable button
            submitBtn.disabled = false;
            submitBtnText.innerHTML = 'Issue QR Code';
            submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
        });
    </script>
</body>
</html>
