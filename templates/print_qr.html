<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funfair 2026 - QR Code</title>
    <style>
        @media print {
            /*@page {
                margin: 0;
                size: A4;
            }*/
            @page {
                size: 80mm auto;
                margin: 5mm;
            }
            body {
                margin: 0;
                padding: 20px;
            }
            .no-print {
                display: none !important;
            }
            /* Hide browser elements */
            header, footer, nav, aside {
                display: none !important;
            }
        }
        
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background: #fff;
        }
        
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            text-align: center; 
        }
        
        h1 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #333;
        }
        
        .qr { 
            background: #fff; 
            padding: 20px; 
            border-radius: 12px; 
            display: inline-block;
            margin: 20px 0;
        }
        
        .qr img {
            max-width: 300px;
            width: 100%;
            height: auto;
        }
        
        .meta { 
            margin-top: 20px; 
            color: #333;
            font-size: 16px;
            line-height: 1.8;
        }
        
        .meta div {
            margin: 8px 0;
        }
        
        .btn { 
            margin-top: 20px; 
            padding: 12px 24px; 
            background: #007bff; 
            color: #fff; 
            border: 0; 
            border-radius: 6px; 
            cursor: pointer;
            font-size: 16px;
        }
        
        .btn:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Funfair 2026</h1>
        <div class="qr">
           <img
                src="data:image/png;base64,{{ qr_code }}"
                style="width:160px; height:160px;"
                alt="QR Code"
            />
        </div>
        <div class="meta">
            <div id="name"></div>
            <div id="ticket_id"></div>
            <div id="balance"></div>
            <div id="issued"></div>
        </div>
        <button class="btn no-print" onclick="window.print()">Print</button>
    </div>

        document.getElementById('qrImg').src = 'data:image/png;base64,' + (params.get('qr_image') || '');

        document.getElementById('balance').textContent = 'Balance: AED ' + (params.get('balance') || '');
        document.getElementById('issued').textContent = 'Issued: ' + (params.get('issue_date') || '');
    </script>

    <script>
        window.onload = function () {
            setTimeout(() => window.print(), 300);
        };
    </script>
</body>
</html>
