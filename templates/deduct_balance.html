<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deduct Balance - Funfair</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 10px; }
        .form-group { margin: 15px 0; }
        label { font-weight: bold; display: block; margin-bottom: 6px; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        .btn { background: #28a745; color: #fff; border: 0; padding: 12px; border-radius: 6px; width: 100%; cursor: pointer; margin-top: 10px; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; padding: 12px; border-radius: 6px; margin: 10px 0; }
        .info { background: #e7f3ff; padding: 12px; border-radius: 6px; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Deduct from Balance</h2>
        <div class="info">Current Balance: AED {{ balance if balance is not none else 'N/A' }}</div>
        <div class="form-group">
            <label for="amount">Amount (AED)</label>
            <input type="number" step="0.01" id="amount" placeholder=""/>
        </div>
        <button class="btn" id="deductBtn">Deduct</button>
        <div id="msg"></div>
    </div>
    <script>
        const ticketId = '{{ ticket_id }}';
        const user = '{{ user }}';
        document.getElementById('deductBtn').addEventListener('click', async function() {
            const amount = parseFloat(document.getElementById('amount').value || '0');
            const resp = await fetch('/deduct_balance', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ticket_id: ticketId, amount: amount, user: user })
            });
            const result = await resp.json();
            if (resp.ok && result.success) {
                window.location.href = `/end_transaction?amount=${encodeURIComponent(result.amount)}&user=${encodeURIComponent(user)}`;
            } else {
                document.getElementById('msg').innerHTML = `<div class="error">${result.message || 'Error'}</div>`;
            }
        });
    </script>
</body>
</html>
